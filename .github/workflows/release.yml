name: Release

# Publishing a tag (v1.2.3) builds the Safari extension, packages it, and opens a
# draft GitHub release carrying that build and the commits since the previous
# version — nothing goes live until it is published by hand.
on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # `src/web-scrobbler` is the upstream submodule; the build has nothing
          # to work with without it.
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2 # matches the `packageManager` field

      # The build takes its version from package.json, so a tag that disagrees
      # with it publishes an extension that reports the wrong version — which is
      # exactly what v1.0.0 did, tagged before the version was bumped.
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(bun -e 'console.log((await Bun.file("package.json").json()).version)')
          if [ "${TAG#v}" != "$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version. Bump the version and re-tag, so the build and the release agree."
            exit 1
          fi
          echo "Tag $TAG matches package.json version $version."

      # Installs Kit's dependencies and, via the postinstall hook, the
      # submodule's own.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check and lint
        run: bun run check

      # The toolbar icons are rendered by a headless browser, which the runner
      # image provides on PATH as `google-chrome`. `build:release` leaves out the
      # popup state gallery, so the zip carries only what a user needs.
      - name: Build the extension
        run: bun run build:release

      - name: Package the extension
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd build/preview
          zip -r "../../KitScrobbler-$TAG.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: KitScrobbler-${{ github.ref_name }}
          path: KitScrobbler-${{ github.ref_name }}.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to create the release

    steps:
      # Full history and tags, so the notes can find the previous release.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/download-artifact@v4
        with:
          name: KitScrobbler-${{ github.ref_name }}
          path: dist

      # Every commit since the last version tag, short ref linked to the full one.
      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The nearest version tag behind the commit being released, so the list
          # is right even if tags are not published in version order.
          previous=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            range="$previous..$TAG"
            heading="Changes since $previous"
          else
            range="$TAG"
            heading="First release"
          fi

          {
            echo "## $heading"
            echo
            git log "$range" --pretty=format:"- [\`%h\`](https://github.com/$GITHUB_REPOSITORY/commit/%H) %s"
            echo
          } > release-notes.md

          cat release-notes.md

      # A draft, so the notes and the attached build can be reviewed before
      # anything is published. Publish it (or delete and re-tag to regenerate)
      # from the Releases page.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "dist/KitScrobbler-$TAG.zip" \
            --title "$TAG" \
            --notes-file release-notes.md \
            --draft
