<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Kit Scrobbler — popup states</title>
		<link rel="stylesheet" href="../vendor/phosphor/style.css" />
		<link rel="stylesheet" href="../shared/theme.css" />
		<link rel="stylesheet" href="../shared/base.css" />
		<link rel="stylesheet" href="./dev.css" />
	</head>
	<body class="dev">
		<header class="dev__header">
			<h1 class="dev__heading">Popup states</h1>
			<div class="dev__controls">
				<div class="segmented" role="tablist">
					<button
						class="segmented__item"
						type="button"
						role="tab"
						data-theme="theme-system"
						aria-selected="true"
					>
						System
					</button>
					<button
						class="segmented__item"
						type="button"
						role="tab"
						data-theme="theme-light"
						aria-selected="false"
					>
						Light
					</button>
					<button
						class="segmented__item"
						type="button"
						role="tab"
						data-theme="theme-dark"
						aria-selected="false"
					>
						Dark
					</button>
				</div>
				<button class="button" type="button" id="reload">Reload</button>
			</div>
		</header>
		<div class="dev__grid" id="grid"></div>
		<script type="module" src="./dev.ts"></script>
	</body>
</html>
